<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sickle Cell Connect — Download</title>
  <style>
    :root {
      --bg: #f8fafc;
      --text: #111827;
      --muted: #6b7280;
      --accent: #5BB2BE;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .icon {
      width: 160px;
      height: 160px;
      border-radius: 36px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
    }
    p.lead {
      margin: 0 0 24px;
      color: var(--muted);
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 1.05rem;
    }
    .btn:hover { filter: brightness(0.95); }
    ol {
      text-align: left;
      margin: 28px auto 0;
      padding-left: 1.25rem;
      color: var(--muted);
      line-height: 1.6;
      max-width: 360px;
    }
    ol li { margin-bottom: 10px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/icon.png" alt="Sickle Cell Connect app icon" />
    <h1>Sickle Cell Connect</h1>
    <p class="lead">Android download</p>

    <a class="btn" href="/sickle-cell-connect.apk" download>
      Download APK
    </a>

    <ol>
      <li>Tap the download link</li>
      <li>Allow installs from the browser / unknown sources (wording varies by phone)</li>
      <li>Open the downloaded APK and install</li>
    </ol>
  </main>
</body>
</html>
